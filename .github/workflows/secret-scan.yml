name: Secret scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify Gitleaks 8.30.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $scanner = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Invoke-WebRequest -Uri 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          $expected = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Gitleaks archive hash mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $scanner
          & (Join-Path $scanner 'gitleaks.exe') git . --log-opts=--all --redact=100 --ignore-gitleaks-allow --no-banner --no-color
          if ($LASTEXITCODE -ne 0) { throw 'Secret scan failed' }
